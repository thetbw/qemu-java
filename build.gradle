plugins {
    id 'java'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    group = 'org.anarres.qemu'

    repositories {
        mavenLocal()
        mavenCentral()
    }

    dependencies {
        implementation 'com.google.code.findbugs:annotations:2.0.3'
        implementation "org.slf4j:slf4j-api:1.7.12"
        implementation "com.google.guava:guava:18.0"
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
        testImplementation platform('org.junit:junit-bom:5.10.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
    }

    test {
        useJUnitPlatform()
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java

                pom {
                    name = "${project.name}"
                }
            }
        }
        repositories {
            maven {
                // 定义 RELEASE 仓库
                def releasesRepoUrl = System.getenv("MAVEN_URL_RELEASE")
                // 定义 SNAPSHOT 仓库
                def snapshotsRepoUrl = System.getenv("MAVEN_URL_SNAPSHOT")

                // 根据版本号自动选择仓库
                url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl


                credentials {
                    username = System.getenv("MAVEN_USERNAME")
                    password = System.getenv("MAVEN_PASSWORD")
                }
            }
        }
    }

}


project(':qemu-qapi') {
    sourceSets {
        generate
    }
    configurations {
        generateCompile.extendsFrom compile
        generateRuntime.extendsFrom runtime

        generateCompile.exclude group: 'commons-logging'
        generateCompile.exclude group: 'log4j'
    }

    dependencies {
        def slf4jVersion = '1.7.12'
        generateRuntime "org.slf4j:slf4j-simple:$slf4jVersion"
        generateRuntime "org.slf4j:log4j-over-slf4j:$slf4jVersion"
        generateRuntime "org.slf4j:jcl-over-slf4j:$slf4jVersion"
        generateRuntime "net.sf.jopt-simple:jopt-simple:4.8"
        generateRuntime "com.google.guava:guava:18.0"
        generateRuntime "org.apache.velocity:velocity:1.7"
        generateRuntime "org.apache.velocity:velocity-tools:2.0"
        generateRuntime "commons-logging:commons-logging:1.1.3"
        generateRuntime "com.google.code.gson:gson:2.3.1"
        generateRuntime 'com.google.code.findbugs:annotations:2.0.3'

        testImplementation "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.5.2"
        testImplementation project(':qemu-manager')
        testImplementation testFixtures(project(':qemu-exec'))
    }

    tasks.register('generate', JavaExec) {
        dependsOn compileGenerateJava
        outputs.upToDateWhen { false }
        doFirst {
            delete fileTree("src/main/java/org/anarres/qemu/qapi/api") {
                include "*.java"
                exclude "package-info.java"
            }
        }
        main = 'org.anarres.qemu.qapi.generator.Main'
        classpath = configurations.generateRuntime + sourceSets.generate.output
        // See also http://repo.or.cz/w/qemu/qmp-unstable.git/blob_plain/HEAD:/qapi-schema.json
    }
}

project(':qemu-image') {
    dependencies {
        implementation 'com.google.code.findbugs:annotations:2.0.3'
        implementation "org.slf4j:slf4j-api:1.7.12"
        implementation "com.google.guava:guava:18.0"
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.5.2'
    }
}

project(':qemu-exec') {
    apply plugin: 'java-test-fixtures'
    // A Java Library
    apply plugin:  'java-library'

    dependencies {
        implementation project(':qemu-image')
        implementation 'org.codehaus.mojo:animal-sniffer-annotations:1.14'

        // Can be changed to qemu-qapi when we move QEmuProcess to qemu-exec.
        testImplementation project(':qemu-qapi')
        testImplementation project(':qemu-manager')
        testImplementation 'commons-io:commons-io:2.4'

    }
}

project(':qemu-manager') {
    apply plugin:  'java-library'
    apply plugin: 'java-test-fixtures'

    dependencies {
        implementation project(':qemu-qapi')
        implementation project(':qemu-exec')
        implementation project(':qemu-image')


//        testFixturesImplementation project(':qemu-exec')
//        testImplementation testFixtures(project(':qemu-exec'))
//        testImplementation project(path: ':qemu-exec', configuration: 'testFixturesApi')
        testImplementation project(':qemu-exec').sourceSets.test.output
    }
}



project(':qemu-examples') {
    apply plugin: 'application'

    application {
        mainClass = 'org.anarres.qemu.examples.Main'
    }

    dependencies {
        implementation project(':qemu-manager')
        implementation project(':qemu-qapi')
        implementation project(':qemu-exec')
        implementation project(':qemu-image')
        implementation 'com.google.auto.service:auto-service:1.0-rc2'
        implementation 'com.jcraft:jsch:0.1.52'

        annotationProcessor 'com.google.auto.service:auto-service:1.0-rc2'
    }
}